[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-analytics"
version = "0.1.0"
description = "College football spread, margin-distribution, and in-game probability modeling for Kalshi markets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "pyarrow>=15.0",
    "click>=8.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
gbm = ["xgboost>=2.0", "lightgbm>=4.1"]
dash = ["streamlit>=1.30", "plotly>=5.18", "altair>=5.2"]
kalshi = ["cryptography>=41.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = [
    "xgboost>=2.0", "lightgbm>=4.1",
    "streamlit>=1.30", "plotly>=5.18", "altair>=5.2",
    "cryptography>=41.0", "pytest>=7.4",
]

[project.scripts]
cfb = "cfb.cli:main"

[tool.setuptools.packages.find]
include = ["cfb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
